name: Build T-Notes calendar
on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD); blank means today in Pennsylvania'
        required: false
        default: ''
      days:
        description: 'Number of calendar days (1–31)'
        required: true
        default: '10'
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Check formatting and parsing
        run: python -m unittest discover -s tests -v
      - name: Generate calendar
        if: github.event_name != 'pull_request'
        env:
          START_DATE: ${{ inputs.start_date }}
          DAYS: ${{ inputs.days || '10' }}
        run: python calendar_builder.py --start "$START_DATE" --days "$DAYS"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: t-notes-calendar
          path: output/
          if-no-files-found: warn
